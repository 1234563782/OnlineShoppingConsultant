server:
  port: 8083

spring:
  application:
    name: catalog-mcp-server
  datasource:
    url: ${SHOPPING_MEMORY_DB_URL:jdbc:mysql://localhost:3306/shopping_consultant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SHOPPING_MEMORY_DB_USERNAME:root}
    password: ${SHOPPING_MEMORY_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  ai:
    mcp:
      server:
        name: catalog-mcp-server
        version: 0.0.2
        type: SYNC
    alibaba:
      mcp:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          namespace: ${NACOS_NAMESPACE:public}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          register:
            enabled: ${NACOS_REGISTER_ENABLED:true}

# Optional: PostgreSQL + pgvector（商品语义索引）；密码等用环境变量，勿写明文
shopping:
  vector:
    enabled: ${SHOPPING_VECTOR_ENABLED:true}
    jdbc-url: ${SHOPPING_VECTOR_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SHOPPING_VECTOR_DB_USERNAME:postgres}
    password: ${SHOPPING_VECTOR_DB_PASSWORD:}
    embedding-model: ${SHOPPING_VECTOR_EMBEDDING_MODEL:text-embedding-v2}
    embedding-dimensions: ${SHOPPING_VECTOR_EMBEDDING_DIMENSIONS:1536}
    # 开启后暴露 POST /api/v1/catalog/product-embeddings/rebuild（仅内网/开发）
    admin-rebuild-enabled: ${SHOPPING_VECTOR_ADMIN_REBUILD_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
