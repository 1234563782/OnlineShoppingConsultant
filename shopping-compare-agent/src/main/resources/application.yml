server:
  port: 8082

spring:
  application:
    name: shopping-compare-agent
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          discovery:
            enabled: false
        server:
          card:
            name: compare_agent
            description: 在线电商商品对比助手
      mcp:
        nacos:
          namespace: ${NACOS_NAMESPACE:public}
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          client:
            enabled: ${NACOS_CLIENT_ENABLED:true}
            sse:
              connections:
                catalog-mcp-server:
                  service-name: catalog-mcp-server
                  version: 0.0.3

shopping:
  agent:
    loop-limit:
      max-iterations: ${SHOPPING_AGENT_MAX_ITERATIONS:6}

agent:
  prompts:
    compare-agent-id: compare-agent

management:
  endpoints:
    web:
      exposure:
        include: health,info
