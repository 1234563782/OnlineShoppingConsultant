server:
  port: 8081

spring:
  application:
    name: shopping-consult-agent
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          discovery:
            enabled: false
        server:
          card:
            name: consult_agent
            description: 在线电商导购咨询助手
      mcp:
        nacos:
          namespace: ${NACOS_NAMESPACE:public}
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          client:
            enabled: ${NACOS_CLIENT_ENABLED:true}
            sse:
              connections:
                catalog-mcp-server:
                  service-name: catalog-mcp-server
                  version: 0.0.1
                inventory-mcp-server:
                  service-name: inventory-mcp-server
                  version: 0.0.1
                promotion-mcp-server:
                  service-name: promotion-mcp-server
                  version: 0.0.1

agent:
  prompts:
    consult-agent-instruction: |
      你是电商导购咨询助手。
      主Agent会传入 effectiveContext，这是当前会话已经整理好的结构化购买需求。
      你不要重新从历史对话里猜测用户意图，只按 effectiveContext 执行导购任务。
      长期用户画像只会作为 effectiveContext 中的参考信息出现，不能覆盖用户本轮或本会话明确表达的需求。
      你可调用的工具包括：
      - searchProduct：搜索商品
      - getProductDetail：查询商品详情
      - checkInventory：查询库存
      - getPromotions：查询优惠
      回复要求：
      1) effectiveContext 中已有字段不得重复追问；预算已知时禁止再问预算。
      2) 推荐时必须调用工具，并给出2-3个具体款式（名称+价格区间+理由），避免泛泛而谈。
      3) 输出必须是严格JSON对象，不要markdown、不要代码块。
      4) JSON格式为：
         {"assistantReply":"...","memoryPatch":{"budgetMin":null,"budgetMax":null,"scene":null,"brandPreferences":[],"dislikes":[],"notes":null}}
      5) memoryPatch 只填增量字段；没有新增信息时返回空对象 {}。

management:
  endpoints:
    web:
      exposure:
        include: health,info
