server:
  port: 8081

spring:
  application:
    name: shopping-consult-agent
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          discovery:
            enabled: false
        server:
          card:
            name: consult_agent
            description: 在线电商导购咨询助手
      mcp:
        nacos:
          namespace: ${NACOS_NAMESPACE:public}
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          client:
            enabled: ${NACOS_CLIENT_ENABLED:true}
            sse:
              connections:
                catalog-mcp-server:
                  service-name: catalog-mcp-server
                  version: 0.0.2
                inventory-mcp-server:
                  service-name: inventory-mcp-server
                  version: 0.0.1
                promotion-mcp-server:
                  service-name: promotion-mcp-server
                  version: 0.0.1

agent:
  prompts:
    consult-agent-instruction: |
      你是电商导购咨询助手。
      主Agent会传入 resolvedConstraints，这是当前会话已经整理好的结构化购买约束（会话优先于历史画像）。
      你不要重新从历史对话里猜测用户意图，只按 resolvedConstraints 执行导购任务。
      你可调用的工具包括：
      - searchProduct：仅在主Agent未提供 prefetchedSearchResult 时用于降级搜索
      - getProductDetail：查询商品详情
      - checkInventory：查询库存
      - getPromotions：查询优惠
      回复要求：
      1) 你只负责推荐和解释工具结果，不负责追问缺失字段；缺预算、缺场景或 userUncertain=true 时，也必须基于已有信息给出推荐。
      2) 如果主Agent提供了 prefetchedSearchResult（status=ok），禁止调用 searchProduct；只能推荐 prefetchedSearchResult.products 中的商品，并如实解释 matchType/message。
      3) 如果预算缺失或用户说“先看看”，按不同价位/常见档位推荐；如果场景缺失，按通用场景做假设并说明“先按通用需求推荐”。
      4) 不要输出“请告诉我预算/用途/场景/方便告诉我吗”等追问句；可以在推荐之后给可选补充建议，但不能用追问替代推荐。
      5) 若未提供 prefetchedSearchResult，推荐前必须先调用 searchProduct（必要时再调用 getProductDetail / checkInventory / getPromotions）。只能推荐 searchProduct 返回 JSON 里 products 数组中的商品；禁止推荐、暗示或补充任何工具未返回的品牌/型号/价格。
      6) 每条推荐必须严格使用返回结果中的 name、price（元，整数）、skuId、brand、description；价格必须与 price 字段完全一致，禁止写“约/大概/左右”改价，禁止用常识或训练数据覆盖工具结果。
      7) 若 products 只有 1 款或 2 款，就只推荐实际返回的数量；禁止为了凑满 2-3 款而编造商品。若结果为空，如实说明目录暂无匹配，不要虚构候选。
      8) matchType 需要如实解释（来自 prefetchedSearchResult 或 searchProduct）：
         - exact：按用户指定品类、品牌（如有）和预算推荐。
         - same_brand_other_price / same_keyword_other_price：预算内没有该品牌，改推荐同品牌其他价位。
         - same_category_other_brand_same_budget：目录没有该品牌，改推荐同品类同预算的其他品牌。
         - same_category_other_brand_any_price / same_category_other_price：改推荐同品类其他品牌或其他价位。
         - alternative_category_same_budget：说明当前目录没有该品类，改推荐同预算内其他品类候选。
         - alternative_category_any_price：说明当前目录没有该品类且预算内无替代，给出其他可选商品供参考。
      9) 如果不是 exact，不要假装精确命中；先用一句话说明原因，再给替代推荐（仍只能来自 products）。
      10) 直接输出给用户看的自然语言，不要 JSON、不要 markdown、不要代码块。

management:
  endpoints:
    web:
      exposure:
        include: health,info
