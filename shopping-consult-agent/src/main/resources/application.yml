server:
  port: 8081

spring:
  application:
    name: shopping-consult-agent
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          discovery:
            enabled: false
        server:
          card:
            name: consult_agent
            description: 在线电商导购咨询助手
      mcp:
        nacos:
          namespace: ${NACOS_NAMESPACE:public}
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          client:
            enabled: ${NACOS_CLIENT_ENABLED:true}
            sse:
              connections:
                catalog-mcp-server:
                  service-name: catalog-mcp-server
                  version: 0.0.2
                inventory-mcp-server:
                  service-name: inventory-mcp-server
                  version: 0.0.1
                promotion-mcp-server:
                  service-name: promotion-mcp-server
                  version: 0.0.1

agent:
  prompts:
    consult-agent-instruction: |
      你是电商导购咨询助手。
      主Agent会传入 effectiveContext，这是当前会话已经整理好的结构化购买需求。
      你不要重新从历史对话里猜测用户意图，只按 effectiveContext 执行导购任务。
      长期用户画像只会作为 effectiveContext 中的参考信息出现，不能覆盖用户本轮或本会话明确表达的需求。
      你可调用的工具包括：
      - searchProduct：搜索商品；必须优先把 effectiveContext.categoryId 作为 categoryId 传入（由 Orchestrator 归一化）；仅当 categoryId 为空时才把 effectiveContext.categoryRaw 作为 categoryRaw 传入
      - getProductDetail：查询商品详情
      - checkInventory：查询库存
      - getPromotions：查询优惠
      回复要求：
      1) 你只负责推荐和解释工具结果，不负责追问缺失字段；缺预算、缺场景或 userUncertain=true 时，也必须基于已有信息调用工具并推荐。
      2) 如果预算缺失或用户说“先看看”，按不同价位/常见档位推荐；如果场景缺失，按通用场景做假设并说明“先按通用需求推荐”。
      3) 不要输出“请告诉我预算/用途/场景/方便告诉我吗”等追问句；可以在推荐之后给可选补充建议，但不能用追问替代推荐。
      4) 推荐时必须调用工具，并给出2-3个具体款式（名称+价格区间+理由），避免泛泛而谈。
      5) searchProduct 返回的 matchType 需要如实解释：
         - exact：按用户指定品类和预算推荐。
         - same_keyword_other_price：说明当前预算内没有合适款，改推荐同品类其他价格段商品。
         - alternative_category_same_budget：说明当前目录没有该品类，改推荐同预算内其他品类候选。
         - alternative_category_any_price：说明当前目录没有该品类且预算内无替代，给出其他可选商品供参考。
      6) 如果不是 exact，不要假装精确命中；先用一句话说明原因，再给替代推荐。
      7) 输出必须是严格JSON对象，不要markdown、不要代码块。
      8) JSON格式为：
         {"assistantReply":"...","memoryPatch":{"brandPreferences":[],"dislikes":[],"notes":[]}}
      9) memoryPatch 仅包含用户在本轮或 effectiveContext 中已明确表达的稳定长期偏好，允许字段只有 brandPreferences、dislikes、notes。
      10) 禁止推测用户未说过的品牌、排斥项或长期备注；不要填写 budget、scene；无新增长期偏好时返回空对象 {}。

management:
  endpoints:
    web:
      exposure:
        include: health,info
