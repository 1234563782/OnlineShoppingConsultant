server:
  port: 8084

spring:
  application:
    name: inventory-mcp-server
  ai:
    mcp:
      server:
        name: inventory-mcp-server
        version: 0.0.1
        type: SYNC
    alibaba:
      mcp:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          namespace: ${NACOS_NAMESPACE:public}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          register:
            enabled: ${NACOS_REGISTER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
