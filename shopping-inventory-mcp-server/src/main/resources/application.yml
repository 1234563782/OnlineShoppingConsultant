server:
  port: 8084

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spring:
  application:
    name: inventory-mcp-server
  datasource:
    url: ${SHOPPING_MEMORY_DB_URL:jdbc:mysql://localhost:3306/shopping_consultant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SHOPPING_MEMORY_DB_USERNAME:root}
    password: ${SHOPPING_MEMORY_DB_PASSWORD:root}
  ai:
    mcp:
      server:
        name: inventory-mcp-server
        version: 0.0.1
        type: SYNC
    alibaba:
      mcp:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          namespace: ${NACOS_NAMESPACE:public}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          register:
            enabled: ${NACOS_REGISTER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
