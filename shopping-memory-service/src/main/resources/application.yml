server:
  port: 8086

spring:
  application:
    name: shopping-memory-service
  datasource:
    url: jdbc:h2:file:./data/memorydb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
