server:
  port: 8087

spring:
  application:
    name: shopping-orchestrator
  datasource:
    url: ${SHOPPING_MEMORY_DB_URL:jdbc:mysql://localhost:3306/shopping_consultant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SHOPPING_MEMORY_DB_USERNAME:root}
    password: ${SHOPPING_MEMORY_DB_PASSWORD:root}
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          discovery:
            enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

shopping:
  memory:
    base-url: ${SHOPPING_MEMORY_BASE_URL:http://localhost:8086}
  catalog:
    base-url: ${SHOPPING_CATALOG_BASE_URL:http://localhost:8083}
    confidence-threshold: ${SHOPPING_CATALOG_CONFIDENCE_THRESHOLD:0.85}
  session:
    ttl-days: 7
    max-turns: 10
  auth:
    cookie-name: ${SHOPPING_AUTH_COOKIE_NAME:shopping_auth_token}
    token-ttl-days: ${SHOPPING_AUTH_TOKEN_TTL_DAYS:7}
    cookie-secure: ${SHOPPING_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${SHOPPING_AUTH_COOKIE_SAME_SITE:Lax}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
