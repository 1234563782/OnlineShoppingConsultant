server:
  port: 8087

spring:
  application:
    name: shopping-orchestrator
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          discovery:
            enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

shopping:
  memory:
    base-url: ${SHOPPING_MEMORY_BASE_URL:http://localhost:8086}
  catalog:
    base-url: ${SHOPPING_CATALOG_BASE_URL:http://localhost:8083}
    confidence-threshold: ${SHOPPING_CATALOG_CONFIDENCE_THRESHOLD:0.85}
    fallback-enabled: ${SHOPPING_CATALOG_FALLBACK_ENABLED:true}
  session:
    ttl-days: 7
    max-turns: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
