<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Shopping Consultant</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; }
    #log { border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 260px; white-space: pre-wrap; }
    .row { margin-top: 12px; display: flex; gap: 8px; }
    input, button { padding: 8px; }
    #msg { flex: 1; }
  </style>
</head>
<body>
<h2>电商导购 Chat Demo</h2>
<div id="log"></div>
<div class="row">
  <input id="uid" value="u001" placeholder="userId" />
  <input id="sid" placeholder="sessionId(可空)" />
</div>
<div class="row">
  <input id="msg" placeholder="输入你的购买需求，如：想买降噪耳机，预算2000内" />
  <button id="send">发送</button>
</div>

<script>
  const log = document.getElementById('log');
  const uid = document.getElementById('uid');
  const sid = document.getElementById('sid');
  const msg = document.getElementById('msg');
  const send = document.getElementById('send');

  function append(text) {
    log.textContent += text + "\n";
    log.scrollTop = log.scrollHeight;
  }

  send.onclick = async () => {
    const body = {
      userId: uid.value,
      sessionId: (!sid.value || sid.value === "undefined") ? null : sid.value,
      message: msg.value
    };
    append("你: " + body.message);
    const resp = await fetch('/api/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    sid.value = data.sessionId || "";
    append("助手: " + data.reply);
    msg.value = "";
  };
</script>
</body>
</html>
